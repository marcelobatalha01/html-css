<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralização Vertical de Caixas</title>

    <style>
        #conteiner {
            position: relative;
            height: 94vh;

            background-color: purple;
            padding: 10px;   

            background-image: url(imagens/target001.png);
            background-size: 100% 100%;                 
        }
        
        #conteudo {
            position: absolute;
            left: 50%;   
            top: 50%;
            transform: translate(-50%, -50%);

            background-image: url(imagens/target001.png);
            background-size: 100% 100%;            
            height: 300px;
            width: 500px;
            background-color: yellow;
              
                  
        }
    </style>
</head>
<body> <!-- A section e o article apenas deram sentido para a div que ainda pode ser usada para mais organização -->
    
    <section id="conteiner"> 
        <article id="conteudo"
        </article>
    </section>
    
</body>
</html>
