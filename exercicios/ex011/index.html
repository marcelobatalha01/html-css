<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplismente aumente e diminua o tamanho do seu navegador.</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem Flexível">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5</p>
    
    <!-- <audio src="midia/happy-mistake.mp3" controls autoplay></audio> 
     1)Para ter 100% de compatibilidade com todos os navegadores tem que incluir audios com estas extenções MP3 WAV OGG ou... -->

     <audio preload="metadata" controls autoplay loop> <!-- Essa é a forma indicada para adicionar audios sem problema em todos os navegadores -->
            <source src="midia/guanacast-33.mp3" type="audio/mpeg">
            <source src="midia/guanacast-33.mp3" type="audio/OGG">
            <source src="midia/guanacast-33.mp3" type="audio/WAV">

                <p>Infelizmente seu navegador não consegue reproduzir áudio.</p>
                <a href="midia/guanacast-33.mp3">Clique aqui para baixar o arquivo MP3.</a>
     </audio>

     <h1>Reproduzindo Vídeo</h1>
     <p>Vamos aprender a reprozudir vídeos em HTML5</p>

      


</body>
</html>
