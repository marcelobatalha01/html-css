<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cap27 - Aula 1 - FLEXBOX</title>

    <style>
        * {
            margin: 10px;
            padding: 10px;
        }
        div.conteiner {
            background-color: aquamarine;
            display: flex;   
            flex-flow: row nowrap;        

        }

        div.item {
            background-color: bisque;
            border: 1px solid black;
            text-align: center;
            flex-basis: 250px;
            flex-shrink: 1;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
      
    </div>
    
</body>
</html>
