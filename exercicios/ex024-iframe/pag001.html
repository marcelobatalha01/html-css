<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site de Teste</title>

    <style>

       body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: lightgrey;
        }

        table.tab1{
            width: 800px;
            border-collapse: collapse;
        }

        table.tab2{
            width: 650px;
            border-collapse: collapse;
        }

        table.tab1 > thead{
            background-color: rgb(90, 113, 172);
            color: white;
        }

        table.tab2 > thead{
            background-color: rgb(192, 93, 54);
            color: white;
        }

        caption {
            background-color: lightgrey;
            font-size: 1em;
            font-weight: bold;
            padding: 5px;
        }

        tbody > tr:nth-child(odd) {
           background-color: white
        }

        tbody > tr:nth-child(even) {
           background-color: lightgray;
        }

        th {
            border: 1px solid black;
            padding: 10px;
        }

        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        tfoot {
            background-color: black;
            color: white;
        }
        
    </style>
    
</head>
<body>
    
    
    
</body>
</html>
