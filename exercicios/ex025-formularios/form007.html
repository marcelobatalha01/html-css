<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 10 - Select, Option, datalist, textarea</title>
</head>
<body>
    <h1>Elementos que não usam a tag INPUT</h1>
    <form action="cadastro.php" method="post" autocapitalize="on">
        
        
        
        <p>
            <label for="iesest">Estado: </label>
            <select name="Estado" id="iest">

                <option value="" selected> --- Escolha: --- </option>

                <optgroup label="Região Sudeste">
                    <option value="MG">Minas Gerais</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                </optgroup>

                <optgroup label="Região Sul">
                    <option value="SC">Santa Catarina</option>
                    <option value="PR">Paraná</option>
                    <option value="RS">Rio Grande do Sul</option>
                </optgroup>

            </select>
        </p>

        <p>
            <label for="iprof">Profissão: </label>
            <input type="text" name="prof" id="iprof" list="lstprof">

            <datalist id="lstprof">
                <option value="ADM">ADMINISTRADOR</option>
                <option value="PRF">POLICIAL RODOVIÁRIO FEDERAL</option>
                <option value="PROF">PROFESSOR</option>
                <option value="ENC">ENCANADOR</option>
                <option value="PAD">PADEIRO</option>
            </datalist>
        </p>

        <p>
            <label for="imsg">Mensagem: </label> <br>

            <textarea name="msg" id="imsg" cols="30" rows="10">

            </textarea>
        </p>
              
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>








    </form>


</body>
</html>
